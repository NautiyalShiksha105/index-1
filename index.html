<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
</head>
<body bgcolor="white ">
    <div class="contanier"></div>
    <fieldset>
    <h1><dd><B>Calculator</h1>
    <fieldset>
    <h2><b><dd>Addition</h1>
    <form oninput="result.value=parseInt(num1 .value) +parseInt(num2 .value)">
        <input type ="number" id="num1" placeholder="enter the  first number">
         <input type ="number" id="num2" placeholder="enter the  second number">
       result: <output name="result" id="result"></output>
    </form>
        </fieldset>
        <fieldset>
            <h2><b><dd>Subtraction</h1>
            <form oninput="result.value=parseInt(num1 .value) -parseInt(num2 .value)">
        <input type ="number" id="num1" placeholder="enter the  first number">
        <input type ="number" id="num2" placeholder="enter the  second number">
        result: <output name="result" id="result"></output>
            </form>
    </fieldset>
        <fieldset>
        
        <h2><b><dd>Multiplication</h1>
    <form oninput="result.value=parseInt(num1 .value) *parseInt(num2 .value)">
        <input type ="number" id="num1" placeholder="enter the  first number">
        <input type ="number" id="num2" placeholder="enter the  second number">
        result: <output name="result" id="result"></output>
    </form>
        </fieldset>
        <fieldset>
        <h2><b><dd>Divide</h1>
    <form oninput="result.value=parseInt(num1 .value) % parseInt(num2 .value)">
        <input type ="number" id="num1" placeholder="enter the  first number">
        <input type ="number" id="num2" placeholder="enter the  second number">
        result:  <output name="result" id="result"></output>
        
            </fieldset>
            
    </form>
</body>
</html>
